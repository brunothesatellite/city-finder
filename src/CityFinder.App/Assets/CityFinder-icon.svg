<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a7257"/>
      <stop offset="0.55" stop-color="#2e5d46"/>
      <stop offset="1" stop-color="#173a2a"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#ece2d0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7fbd9c" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7fbd9c" stop-opacity="0"/>
    </radialGradient>
    <filter id="pinShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#081b12" flood-opacity="0.38"/>
    </filter>
    <filter id="holeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b2418" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded application tile -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="54" y="54" width="916" height="916" rx="202" fill="none"
        stroke="#f7f3ea" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Map pin -->
  <g filter="url(#pinShadow)">
    <path d="M512 172
             C 354 172 230 296 230 452
             C 230 660 512 864 512 864
             C 512 864 794 660 794 452
             C 794 296 670 172 512 172 Z"
          fill="url(#pin)"/>
  </g>

  <!-- Inner aperture -->
  <g filter="url(#holeShadow)">
    <circle cx="512" cy="446" r="122" fill="#234c39"/>
  </g>
  <circle cx="512" cy="446" r="116" fill="none" stroke="#f7f3ea" stroke-opacity="0.14" stroke-width="3"/>
  <circle cx="512" cy="446" r="54" fill="#f7f3ea" opacity="0.92"/>

  <!-- Soft highlight on the pin head -->
  <path d="M404 286 C 452 246 512 232 566 242"
        fill="none" stroke="#ffffff" stroke-opacity="0.62"
        stroke-width="18" stroke-linecap="round"/>
</svg>
